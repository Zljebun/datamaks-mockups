name: Generiši mockup

on:
  repository_dispatch:
    types: [generate-mockup]

# Da commit u repo uspije
permissions:
  contents: write

concurrency:
  group: mockups-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || npm install

      - name: Generiši
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MOCKUP_ID: ${{ github.event.client_payload.id }}
          OPIS: ${{ github.event.client_payload.opis }}
          TIP: ${{ github.event.client_payload.tip }}
          EMAIL: ${{ github.event.client_payload.email }}
        run: node scripts/generate.mjs

      - name: Commit i push
        run: |
          git config user.name "datamaks-bot"
          git config user.email "info@datamaks.net"
          git add m/ data/mockups.json
          git commit -m "mockup ${{ github.event.client_payload.id }}" || echo "nema promjena"
          git push
