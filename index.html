<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napravite besplatan prototip · Datamaks</title>
<meta name="description" content="Opišite svoj posao i problem, a mi vam napravimo klikabilni prototip softvera i pošaljemo link na mail.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--b1:#1e3a8a;--b2:#1e40af;--b3:#2563eb;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:#f1f5f9}
  .hero{background:linear-gradient(135deg,var(--b1),var(--b3));color:#fff;padding:44px 20px 84px;text-align:center}
  .hero h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;line-height:1.25;max-width:640px;margin:0 auto 12px}
  .hero p{opacity:.92;max-width:560px;margin:0 auto;font-size:16px}
  .wrap{max-width:600px;margin:-56px auto 60px;padding:0 16px}
  .card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.10);padding:26px}
  label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b3);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  textarea{resize:vertical;min-height:110px}
  .field{margin-bottom:16px}
  .cnt{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
  .go{margin-top:6px;width:100%;background:linear-gradient(135deg,var(--b2),var(--b3));color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .go:hover{filter:brightness(1.05)}
  .go:disabled{opacity:.6;cursor:not-allowed}
  .foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:14px}
  .msg{display:none;padding:16px;border-radius:12px;font-size:14.5px;margin-top:4px}
  .msg.ok{display:block;background:#dcfce7;border:1px solid #bbf7d0;color:#166534}
  .msg.err{display:block;background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
</style>
</head>
<body>
  <div class="hero">
    <h1>Napravite besplatan prototip za svoj posao</h1>
    <p>Opišite čime se bavite i šta vas muči. Napravimo vam klikabilni prototip softvera i pošaljemo link na mail.</p>
  </div>
  <div class="wrap">
    <div class="card">
      <form id="f">
        <div class="field">
          <label for="email">Email <span style="color:#ef4444">*</span></label>
          <input id="email" type="email" required placeholder="vas@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="telefon">Telefon <span style="color:#ef4444">*</span></label>
          <input id="telefon" type="tel" required placeholder="+387 6x xxx xxx" autocomplete="tel">
        </div>
        <div class="field">
          <label for="tip">Djelatnost</label>
          <select id="tip">
            <option value="">Izaberite (opcionalno)</option>
            <option>Proizvodnja / zanat</option>
            <option>Trgovina / veleprodaja</option>
            <option>Ugostiteljstvo</option>
            <option>Usluge / servis</option>
            <option>Zdravstvo / ordinacija</option>
            <option>Ljepota / salon</option>
            <option>Transport / distribucija</option>
            <option>Građevina</option>
            <option>Drugo</option>
          </select>
        </div>
        <div class="field">
          <label for="opis">Opišite svoj posao i problem <span style="color:#ef4444">*</span></label>
          <textarea id="opis" required maxlength="600" placeholder="npr. Imam auto servis, ne mogu pratiti koja su vozila kod mene i kad su gotova. Ljudi me stalno zovu da pitaju je li auto gotov."></textarea>
          <div class="cnt"><span id="cc">0</span>/600</div>
        </div>
        <button class="go" id="go" type="submit">Napravite mi prototip →</button>
        <div class="foot">Prototip stiže na vaš mail za par minuta · bez naplate · Datamaks</div>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>

<script>
// TODO: postaviti URL Supabase Edge Function-a nakon deploya
const ENDPOINT = "https://YOUR-PROJECT.supabase.co/functions/v1/submit";

const opis=document.getElementById('opis'), cc=document.getElementById('cc');
opis.addEventListener('input',()=>cc.textContent=opis.value.length);

const form=document.getElementById('f'), go=document.getElementById('go'), msg=document.getElementById('msg');
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const payload={
    email:document.getElementById('email').value.trim(),
    telefon:document.getElementById('telefon').value.trim(),
    tip:document.getElementById('tip').value,
    opis:opis.value.trim()
  };
  go.disabled=true; go.textContent="Šaljemo…"; msg.className="msg";
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(r.ok){
      form.style.display="none";
      msg.className="msg ok";
      msg.innerHTML="<b>Hvala!</b> Vaš prototip se pravi. Za par minuta stiže link na <b>"+payload.email+"</b>. Provjerite i spam/promocije.";
    }else if(r.status===409){
      msg.className="msg err";
      msg.textContent="Za ovu kombinaciju emaila i telefona je već napravljen prototip. Za novi ili punu verziju javite se na datamaks.net.";
      go.disabled=false; go.textContent="Napravite mi prototip →";
    }else{
      throw new Error(d.error||"Greška");
    }
  }catch(err){
    msg.className="msg err";
    msg.textContent="Nešto nije uspjelo. Pokušajte ponovo ili nas kontaktirajte na datamaks.net.";
    go.disabled=false; go.textContent="Napravite mi prototip →";
  }
});
</script>
</body>
</html>
