<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead-ovi · Datamaks admin</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--b2:#1e40af;--b3:#2563eb;--ink:#0f172a;--mut:#64748b;--line:#e6eaf0;--bg:#f1f5f9}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg)}
  .top{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
  .top b{font-family:'Plus Jakarta Sans';font-size:16px}
  .top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
  .top button{background:rgba(255,255,255,.18);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  /* login */
  .login{max-width:380px;margin:80px auto;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.1);padding:28px;text-align:center}
  .login h1{font-family:'Plus Jakarta Sans';font-size:20px;margin-bottom:8px}
  .login p{color:var(--mut);font-size:14px;margin-bottom:18px}
  .login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px}
  .login button{width:100%;background:linear-gradient(135deg,var(--b2),var(--b3));color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
  .err{color:#b91c1c;font-size:13px;margin-top:10px;min-height:18px}
  /* stats */
  .stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;flex:1;min-width:110px}
  .stat .n{font-family:'Plus Jakarta Sans';font-size:22px;font-weight:800}
  .stat .l{font-size:12px;color:var(--mut)}
  /* table */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  th{background:#f8fafc;font-weight:600;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tr:hover td{background:#fafbfc}
  .badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .b-queued{background:#fef9c3;color:#854d0e}
  .b-live{background:#dcfce7;color:#166534}
  .b-archived{background:#e2e8f0;color:#475569}
  .b-rejected{background:#fee2e2;color:#991b1b}
  .opis{max-width:340px;color:#334155}
  .opis.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .act{white-space:nowrap}
  .act a,.act button{font-size:12.5px;color:var(--b2);text-decoration:none;background:none;border:none;cursor:pointer;font-weight:600;padding:2px 4px}
  .muted{color:#94a3b8}
  .empty{padding:40px;text-align:center;color:var(--mut)}
  @media(max-width:720px){.tel-col,.tip-col{display:none}.opis{max-width:160px}}
</style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login" class="login">
    <h1>Datamaks · Lead-ovi</h1>
    <p>Unesite admin lozinku za pregled.</p>
    <input id="tok" type="password" placeholder="Admin lozinka" autocomplete="current-password">
    <button onclick="login()">Prijava</button>
    <div class="err" id="err"></div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <div class="top">
      <b>Datamaks · Lead-ovi</b>
      <div class="sp">
        <button onclick="load()">↻ Osvježi</button>
        <button onclick="logout()">Odjava</button>
      </div>
    </div>
    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="card"><div id="tbl"><div class="empty">Učitavanje…</div></div></div>
    </div>
  </div>

<script>
const FN = "https://tjufkzervoxvyteomaww.supabase.co/functions/v1/leads";
const KEY = "dmk_admin_token";
let TOKEN = localStorage.getItem(KEY) || "";

function esc(s){return (s||'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function fmtDate(s){const d=new Date(s);return d.toLocaleString('bs-BA',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}

async function api(path=""){
  const r = await fetch(FN+path, { headers: { "x-admin-token": TOKEN } });
  if(r.status===401) throw new Error("401");
  return r.json();
}

function login(){
  TOKEN = document.getElementById('tok').value.trim();
  if(!TOKEN) return;
  document.getElementById('err').textContent = "Provjera…";
  api().then(data=>{
    localStorage.setItem(KEY, TOKEN);
    show(); render(data);
  }).catch(e=>{
    document.getElementById('err').textContent = e.message==="401" ? "Pogrešna lozinka." : "Greška pri povezivanju.";
  });
}
function logout(){ localStorage.removeItem(KEY); TOKEN=""; location.reload(); }
function show(){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; }

async function load(){
  document.getElementById('tbl').innerHTML='<div class="empty">Učitavanje…</div>';
  try{ render(await api()); }
  catch(e){ if(e.message==="401") logout(); else document.getElementById('tbl').innerHTML='<div class="empty">Greška pri učitavanju.</div>'; }
}

function render(rows){
  if(!Array.isArray(rows)) rows=[];
  const c={total:rows.length,live:0,queued:0,archived:0,rejected:0};
  rows.forEach(r=>{ if(c[r.status]!==undefined) c[r.status]++; });
  document.getElementById('stats').innerHTML =
    `<div class="stat"><div class="n">${c.total}</div><div class="l">Ukupno</div></div>
     <div class="stat"><div class="n" style="color:#166534">${c.live}</div><div class="l">Aktivni</div></div>
     <div class="stat"><div class="n" style="color:#854d0e">${c.queued}</div><div class="l">U redu</div></div>
     <div class="stat"><div class="n" style="color:#475569">${c.archived}</div><div class="l">Arhivirani</div></div>`;

  if(!rows.length){ document.getElementById('tbl').innerHTML='<div class="empty">Još nema lead-ova.</div>'; return; }
  const body = rows.map(r=>{
    const live = r.status==='live';
    const arch = r.status==='archived';
    const act = live ? `<a href="https://demo.datamaks.net/m/${encodeURIComponent(r.mockup_id)}/" target="_blank" rel="noopener">Otvori mockup ↗</a>`
              : arch ? `<button onclick="viewArh('${r.mockup_id}')">Vidi arhivu</button>`
              : `<span class="muted">${esc(r.status)}</span>`;
    return `<tr>
      <td class="muted">${fmtDate(r.created_at)}</td>
      <td><span class="badge b-${esc(r.status)}">${esc(r.status)}</span></td>
      <td>${esc(r.email)}<br><span class="muted tel-col">${esc(r.telefon)}</span></td>
      <td class="tip-col muted">${esc(r.tip||'')}</td>
      <td class="opis clip" title="Klik za cijeli tekst" onclick="this.classList.toggle('clip')">${esc(r.opis)}</td>
      <td class="act">${act}</td>
    </tr>`;
  }).join('');
  document.getElementById('tbl').innerHTML =
    `<table><thead><tr><th>Datum</th><th>Status</th><th>Email / telefon</th><th class="tip-col">Djelatnost</th><th>Opis problema</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}

async function viewArh(id){
  try{
    const lead = await api("?id="+encodeURIComponent(id));
    if(!lead || !lead.mockup_html){ alert("Arhiva nije dostupna."); return; }
    const w = window.open("", "_blank");
    w.document.write(lead.mockup_html); w.document.close();
  }catch(e){ alert("Greška pri učitavanju arhive."); }
}

// auto-login ako token postoji
if(TOKEN){ api().then(d=>{show();render(d);}).catch(()=>{ /* ostani na login */ }); }
</script>
</body>
</html>
