name: Istek mockupa (24h)

on:
  schedule:
    - cron: "17 * * * *"   # svaki sat u :17
  workflow_dispatch: {}      # ručno pokretanje po potrebi

permissions:
  contents: write

concurrency:
  group: mockups-expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || npm install

      - name: Istek + arhiviranje (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/expire.mjs

      - name: Commit isteklih (master → stub + json)
        run: |
          git config user.name "datamaks-bot"
          git config user.email "info@datamaks.net"
          git add m/ data/mockups.json
          git commit -m "istek $(date -u +%FT%TZ)" || echo "nema isteka"
          git push
